# Drizzle MCP CI/CD: typecheck, tests y deploy a Cloudflare Workers
name: Drizzle MCP CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Node + Bun + caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
